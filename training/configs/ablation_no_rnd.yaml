# Training ablation preset: RND curiosity disabled (compare against full EMLRP+RND baseline)

train:
  run_name: emlrp_ablation_no_rnd
  device: auto
  seed: 42
  total_steps: 500000
  eval_interval_updates: 25
  save_interval_updates: 25
  eval_maps_per_tier: 2

env:
  num_envs: 20
  use_subproc: true
  initial_stage: 0
  episode_ticks: 2100
  render_buffers: true
  use_depth: true
  use_episodic_novelty: true
  sticky_action_prob: 0.05
  potential_scale: 1.0
  dataset_manifest: maps/dataset/manifest.json
  dataset_mix_prob: 0.25
  map_reuse_episodes: 3

ppo:
  rollout_len: 128
  seq_len: 32
  minibatch_seqs: 40
  use_bf16: true
  ppo_epochs: 3
  gamma: 0.995
  gamma_int: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_clip_eps: 0.2
  vf_ext_coef: 0.5
  vf_int_coef: 0.25
  entropy_coef_start: 0.01
  entropy_coef_end: 0.002
  intrinsic_coef_start: 0.0
  intrinsic_coef_end: 0.0
  aux_coef: 0.1
  lr: 0.0003
  lr_end: 0.00003
  max_grad_norm: 0.5
  target_kl: 0.03
  entity_dropout_prob: 0.05
  obs_noise_std: 0.01

rnd:
  emb_dim: 128
  lr: 0.0001
  scale: 0.0
