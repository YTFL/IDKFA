# Fast under-20-minute survival & navigation PPO fine-tuning on local 12-core CPU + RTX 4050 CUDA

train:
  run_name: emlrp_survival_ft
  device: cuda
  seed: 42
  total_steps: 92160
  eval_interval_updates: 12
  save_interval_updates: 12
  eval_maps_per_tier: 2

env:
  num_envs: 20
  use_subproc: true
  initial_stage: 5
  episode_ticks: 2100
  render_buffers: true
  use_depth: true
  use_episodic_novelty: true
  sticky_action_prob: 0.05
  potential_scale: 1.0
  dataset_manifest: maps/dataset/manifest.json
  dataset_mix_prob: 0.30
  map_reuse_episodes: 3

ppo:
  rollout_len: 128
  seq_len: 32
  minibatch_seqs: 40
  use_bf16: true
  use_action_mask: true
  critic_warmup_updates: 5
  bc_kl_coef: 0.05
  ppo_epochs: 3
  gamma: 0.995
  gamma_int: 0.99
  gae_lambda: 0.95
  clip_eps: 0.12
  value_clip_eps: 0.2
  vf_ext_coef: 0.5
  vf_int_coef: 0.25
  entropy_coef_start: 0.004
  entropy_coef_end: 0.001
  intrinsic_coef_start: 0.08
  intrinsic_coef_end: 0.02
  aux_coef: 0.1
  lr: 0.00004
  lr_end: 0.00001
  max_grad_norm: 0.5
  target_kl: 0.025
  entity_dropout_prob: 0.02
  obs_noise_std: 0.005

rnd:
  emb_dim: 128
  lr: 0.0001
  scale: 0.05

reward:
  damage_penalty_per_hp: -0.015
  heal_reward_per_hp: 0.015
  death_penalty: -6.0
  wall_hug_penalty: -0.05
  stuck_penalty: -0.08
  cell_reward: 0.03
  door_reward: 0.75
